# Server stack (no client apps) for Coolify. Domains, secrets and ports: docs/REALTIME.md §5.

x-realtime-env: &realtime-env
  REDIS_URL: redis://redis:6379/0
  RT_JWT_SECRET: ${SERVICE_PASSWORD_64_RTJWT}
  RT_INTERNAL_SECRET: ${SERVICE_PASSWORD_64_RTINTERNAL}

services:
  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_GATEWAY_80
      - GATEWAY_TLS=off
      - CORE_HOST=app:8000
      - REVERB_HOST=app:8000
      - AI_HOST=app:8000
      - LIVEKIT_HOST=livekit:7880
      - INGEST_HOST=ingest:8081
      - HUB_HOST=hub:8082
      - RECORD_HOST=record:8083
      - CLIENT_MAX_BODY_SIZE=100M
    expose:
      - "80"
    depends_on:
      - app
      - ingest
      - hub
      - record

  app:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      APP_NAME: FoxyExam
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: https://${SERVICE_FQDN_GATEWAY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-foxy_core}
      DB_USERNAME: ${DB_USERNAME:-foxy}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      RUN_MIGRATIONS: "true"
      AI_WORKER_URL: ${AI_WORKER_URL:-}
      AI_WORKER_TIMEOUT: ${AI_WORKER_TIMEOUT:-2}
      AI_ENFORCE: ${AI_ENFORCE:-false}
      RT_JWT_SECRET: ${SERVICE_PASSWORD_64_RTJWT}
      RT_INTERNAL_SECRET: ${SERVICE_PASSWORD_64_RTINTERNAL}
      RT_INGEST_URL: https://${SERVICE_FQDN_GATEWAY}/rt/ingest
      RT_INGEST_INTERNAL_URL: http://ingest:8081
      RT_HUB_URL: wss://${SERVICE_FQDN_GATEWAY}/rt/hub
      RT_RECORD_URL: https://${SERVICE_FQDN_GATEWAY}/rt/record
      LIVEKIT_PUBLIC_URL: wss://${SERVICE_FQDN_LIVEKIT}
      LIVEKIT_API_KEY: foxy
      LIVEKIT_API_SECRET: ${SERVICE_PASSWORD_64_LIVEKIT}
    expose:
      - "8000"
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build: { context: ./realtime, target: ingest }
    restart: unless-stopped
    environment:
      <<: *realtime-env
      INGEST_RATE_PER_SEC: ${INGEST_RATE_PER_SEC:-5}
      INGEST_BURST: ${INGEST_BURST:-20}
      INGEST_SHED_INFLIGHT: ${INGEST_SHED_INFLIGHT:-2000}
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy

  hub:
    build: { context: ./realtime, target: hub }
    restart: unless-stopped
    environment:
      <<: *realtime-env
      ALLOWED_ORIGINS: ${SERVICE_FQDN_GATEWAY}
      HUB_TICK: 1s
      HUB_OFFLINE_AFTER: ${HUB_OFFLINE_AFTER:-20s}
    expose:
      - "8082"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: { context: ./realtime, target: worker }
    restart: unless-stopped
    environment:
      <<: *realtime-env
      LARAVEL_BULK_URL: http://app:8000/api/internal/v1/events/bulk
      WORKER_BATCH: ${WORKER_BATCH:-500}
      S3_ENDPOINT: s3:9000
      S3_ACCESS_KEY: ${SERVICE_USER_S3}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_64_S3}
      S3_BUCKET: ${S3_BUCKET:-foxy-records}
      S3_SSL: "false"
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
      s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"foxy","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    environment:
      - SERVICE_FQDN_S3_9000
      - S3_ACCESS_KEY=${SERVICE_USER_S3}
      - S3_SECRET_KEY=${SERVICE_PASSWORD_64_S3}
    expose:
      - "9000"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  redisdata:
  s3data:
  app_storage:
