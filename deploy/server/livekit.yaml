# LiveKit (SFU) for FoxyExam — Linux / Coolify.
# The API key/secret come from the LIVEKIT_KEYS environment variable ("foxy: <secret>"), see docker.compose.server.yml.
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881        # TCP fallback (publish this port on the host)
  udp_port: 7882        # ONE multiplexed UDP port (publish it on the host) instead of a range
  use_external_ip: true # advertise the VPS public IP

redis:
  address: redis:6379

logging:
  level: info
  pion_level: warn

# Candidates publish camera + screen; the recorder is told about it through this webhook.
webhook:
  api_key: foxy
  urls:
    - http://record:8083/v1/webhooks/livekit
