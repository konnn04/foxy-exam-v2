# LiveKit Server Configuration for FoxyExam VPS Deployment
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

redis:
  address: redis:6379

keys:
  devkey: devsecret

logging:
  level: info
  pion_level: warn

turn:
  enabled: false

webhook:
  api_key: devkey
  urls:
    - http://app:8000/api/v1/livekit/webhook
