services:
  # 1. API Gateway (Nginx Reverse Proxy with embedded domains & Auto-SSL)
  gateway:
    build:
      context: ../../gateway
      dockerfile: Dockerfile
    container_name: foxy-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-foxyexam.com}
      SERVER_NAME: "${APP_DOMAIN:-foxyexam.com} *.${APP_DOMAIN:-foxyexam.com} localhost 127.0.0.1"
      CORE_HOST: app:8000
      REVERB_HOST: app:8080
      AI_HOST: ${AI_HOST:-ai-worker:8000}
      LIVEKIT_HOST: ${LIVEKIT_HOST:-livekit:7880}
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - gateway_logs:/var/log/nginx
    depends_on:
      - app

  # 2. Foxy Core Server (Laravel)
  app:
    build:
      context: ../../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${APP_DOMAIN:-foxyexam.com}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-foxy_core}
      DB_USERNAME: ${DB_USERNAME:-foxy_user}
      DB_PASSWORD: ${DB_PASSWORD:-foxy_secret_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_WORKER_URL: ${AI_WORKER_URL:-https://ai.foxyexam.com}
    depends_on:
      - postgres
      - redis

  # 3. Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-foxy_core}
      POSTGRES_USER: ${DB_USERNAME:-foxy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-foxy_secret_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 4. In-memory Cache & Queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "350mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data

volumes:
  gateway_logs:
  pgdata:
  redisdata:
