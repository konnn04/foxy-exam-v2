# ==============================================================================
# 🦊 FOXY EXAM — API GATEWAY (NGINX CORE CONFIGURATION)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Custom log format with latency & upstream telemetry
    log_format gateway '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'urt="$upstream_response_time" host="$host"';

    access_log /var/log/nginx/access.log gateway;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones
    # General API limit: 30 requests/sec per IP, burst 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # Strict Auth limit: 10 requests/sec per IP (chống brute force login)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # Load dynamic service configurations from conf.d
    include /etc/nginx/conf.d/*.conf;
}
